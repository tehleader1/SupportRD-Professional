<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SupportRD Remote | Professional Hair, Studio, Diary, Profile, Catalog</title>
  <meta name="description" content="SupportRD Remote connects hair products, AI assistants, Studio, Diary, Profile, FAQ, Settings, Catalog, Shopify readiness, and rank seriousness in one futuristic dashboard.">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root {
      --sr-bg:#06101f;
      --sr-bg-2:#0e1d33;
      --sr-glass:rgba(9, 21, 39, .58);
      --sr-glass-strong:rgba(9, 21, 39, .78);
      --sr-line:rgba(255,255,255,.16);
      --sr-text:#f8fbff;
      --sr-muted:rgba(248,251,255,.72);
      --sr-aqua:#13b7c7;
      --sr-green:#a9cf43;
      --sr-gold:#f4c75a;
      --sr-red:#8b1d24;
      --sr-shadow:0 28px 80px rgba(0,0,0,.42);
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:radial-gradient(circle at top left, rgba(19,183,199,.22), transparent 28%), linear-gradient(145deg, #030813, var(--sr-bg), #0b172a); color:var(--sr-text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { overflow-x:hidden; }
    a { color:inherit; }
    button { font:inherit; }
    .sr-page { min-height:100vh; padding:0 1rem 2rem; position:relative; }
    .sr-top-ad-strip { position:sticky; top:0; z-index:50; min-height:5.5rem; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(18rem,1fr); gap:.7rem; overflow:hidden; padding:.7rem 1rem; margin:0 -1rem; background:rgba(3,8,19,.82); border-bottom:1px solid var(--sr-line); backdrop-filter:blur(18px); }
    .sr-ad-card { min-height:4.1rem; display:grid; grid-template-columns:4.5rem 1fr auto; gap:.65rem; align-items:center; padding:.45rem; border-radius:1.1rem; border:1px solid var(--sr-line); background:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); box-shadow:0 12px 30px rgba(0,0,0,.18); }
    .sr-ad-card img { width:4.5rem; height:3.4rem; object-fit:cover; border-radius:.8rem; }
    .sr-ad-card span { display:block; color:var(--sr-gold); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; animation:flashAd 1.6s infinite; }
    .sr-ad-card strong { display:block; line-height:1.05; }
    .sr-ad-card p { margin:.1rem 0 0; font-size:.78rem; color:var(--sr-muted); }
    .sr-buy-btn, .sr-nav-btn, .sr-mini-btn { border:0; border-radius:.9rem; padding:.78rem .9rem; font-weight:900; color:#06101f; background:linear-gradient(135deg, var(--sr-aqua), #b8f7ff); box-shadow:0 0 22px rgba(19,183,199,.32); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:.35rem; }
    .sr-buy-btn { white-space:nowrap; animation:flashBuy 1.3s infinite; }
    @keyframes flashBuy { 0%,100% { filter:brightness(1); transform:translateY(0); } 50% { filter:brightness(1.26); transform:translateY(-1px); } }
    @keyframes flashAd { 0%,100% { opacity:.78; } 50% { opacity:1; color:#fff3a6; } }
    .sr-remote-wrap { width:min(1500px, calc(100vw - 2rem)); margin:1.1rem auto 0; display:grid; grid-template-columns:1fr minmax(13rem, 18rem); gap:1rem; align-items:start; }
    .sr-remote { min-height:calc(100vh - 9rem); border:1px solid var(--sr-line); border-radius:2rem; overflow:hidden; background:linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.035)); box-shadow:var(--sr-shadow); backdrop-filter:blur(28px) saturate(130%); position:relative; }
    .sr-remote:before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 18% 5%, rgba(19,183,199,.2), transparent 30%), radial-gradient(circle at 80% 12%, rgba(169,207,67,.16), transparent 30%); pointer-events:none; }
    .sr-remote-head { position:relative; min-height:7rem; padding:1rem; display:grid; grid-template-columns:1fr auto; gap:1rem; align-items:center; border-bottom:1px solid var(--sr-line); background:rgba(6,16,31,.5); }
    .sr-brand h1 { margin:0; font-size:clamp(1.65rem, 4vw, 3.35rem); letter-spacing:-.04em; }
    .sr-brand p { margin:.25rem 0 0; color:var(--sr-muted); }
    .sr-top-actions { display:flex; flex-wrap:wrap; gap:.5rem; justify-content:flex-end; }
    .sr-settings-btn { background:rgba(255,255,255,.1); color:var(--sr-text); border:1px solid var(--sr-line); }
    .sr-catalog-hero-btn { background:linear-gradient(135deg, var(--sr-green), #efffbd); color:#102010; }
    .sr-nav-six { position:relative; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.75rem; padding:1rem; border-bottom:1px solid var(--sr-line); background:rgba(2,7,18,.32); }
    .sr-nav-btn { min-height:5.2rem; color:#fff; background:linear-gradient(135deg, rgba(19,183,199,.78), rgba(14,29,51,.78)); border:1px solid rgba(255,255,255,.18); box-shadow:none; flex-direction:column; text-align:left; align-items:flex-start; }
    .sr-nav-btn span { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.68); }
    .sr-nav-btn.active { outline:2px solid rgba(184,247,255,.5); box-shadow:0 0 32px rgba(19,183,199,.26); }
    .sr-stage { position:relative; min-height:calc(100vh - 23rem); padding:1rem; background:rgba(255,255,255,.025); }
    .sr-panel { min-height:calc(100vh - 25rem); border-radius:1.6rem; border:1px solid var(--sr-line); overflow:hidden; background:rgba(255,255,255,.06); display:grid; grid-template-columns:minmax(18rem,.9fr) 1.1fr; box-shadow:inset 0 0 0 1px rgba(255,255,255,.04); }
    .sr-panel-media { min-height:30rem; background-size:cover; background-position:center; position:relative; }
    .sr-panel-media:after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(3,8,19,.24), transparent); }
    .sr-panel-copy { padding:clamp(1rem,3vw,2rem); display:grid; align-content:center; gap:1rem; }
    .sr-panel-copy span { color:var(--sr-aqua); letter-spacing:.14em; text-transform:uppercase; font-size:.78rem; font-weight:900; }
    .sr-panel-copy h2 { margin:0; font-size:clamp(2.1rem,5vw,5rem); letter-spacing:-.07em; line-height:.92; }
    .sr-panel-copy p { color:var(--sr-muted); font-size:1.05rem; line-height:1.55; }
    .sr-feature-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.6rem; }
    .sr-feature-grid article { min-height:5.75rem; padding:.75rem; border:1px solid var(--sr-line); border-radius:1rem; background:rgba(255,255,255,.07); }
    .sr-feature-grid strong { display:block; }
    .sr-feature-grid small { color:var(--sr-muted); }
    .sr-product-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.75rem; }
    .sr-product-card { min-height:14rem; padding:.7rem; border-radius:1.2rem; border:1px solid var(--sr-line); background:rgba(255,255,255,.08); display:grid; gap:.5rem; }
    .sr-product-card img { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:.9rem; }
    .sr-product-card h3 { margin:0; }
    .sr-product-card p { margin:0; color:var(--sr-muted); font-size:.88rem; }
    .sr-side-ads { position:sticky; top:6.5rem; display:grid; gap:.75rem; max-height:calc(100vh - 7rem); overflow:auto; }
    .sr-side-ad { min-height:13rem; border-radius:1.3rem; overflow:hidden; border:1px solid var(--sr-line); background:var(--sr-glass); box-shadow:0 15px 45px rgba(0,0,0,.25); position:relative; }
    .sr-side-ad img { width:100%; height:10rem; object-fit:cover; display:block; }
    .sr-side-ad div { padding:.75rem; }
    .sr-side-ad span { color:var(--sr-gold); text-transform:uppercase; letter-spacing:.12em; font-size:.7rem; animation:flashAd 1.5s infinite; }
    .sr-side-ad h3 { margin:.2rem 0; }
    .sr-side-ad p { margin:0 0 .6rem; color:var(--sr-muted); font-size:.85rem; }
    .sr-roam { position:fixed; z-index:90; min-width:7.5rem; max-width:11rem; padding:.65rem; border:1px solid var(--sr-line); border-radius:999px; background:rgba(6,16,31,.68); color:#fff; backdrop-filter:blur(15px); box-shadow:0 0 30px rgba(19,183,199,.18); display:flex; gap:.45rem; align-items:center; cursor:pointer; }
    .sr-roam strong { display:block; font-size:.8rem; }
    .sr-roam small { display:block; color:var(--sr-muted); font-size:.7rem; }
    #ariaRoam { left:2vw; top:35vh; animation:ariaFloat 12s infinite alternate ease-in-out; }
    #jakeRoam { right:4vw; top:58vh; animation:jakeFloat 14s infinite alternate ease-in-out; }
    .sr-roam-orb { width:2.25rem; aspect-ratio:1; border-radius:999px; display:grid; place-items:center; background:linear-gradient(135deg, var(--sr-aqua), var(--sr-green)); color:#06101f; font-weight:1000; }
    @keyframes ariaFloat { 0% { transform:translate(0,0) rotate(-2deg); } 35% { transform:translate(18vw,-10vh) rotate(3deg); } 70% { transform:translate(8vw,18vh) rotate(-1deg); } 100% { transform:translate(24vw,4vh) rotate(2deg); } }
    @keyframes jakeFloat { 0% { transform:translate(0,0) rotate(2deg); } 40% { transform:translate(-16vw,-14vh) rotate(-2deg); } 80% { transform:translate(-7vw,12vh) rotate(2deg); } 100% { transform:translate(-22vw,-2vh) rotate(-3deg); } }
    .sr-rank-strip { position:relative; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.65rem; padding:1rem; border-top:1px solid var(--sr-line); background:rgba(3,8,19,.38); }
    .sr-rank-strip article { min-height:4.75rem; padding:.7rem; border-radius:1rem; background:rgba(255,255,255,.07); border:1px solid var(--sr-line); }
    .sr-rank-strip span { display:block; font-size:.7rem; text-transform:uppercase; color:var(--sr-muted); letter-spacing:.1em; }
    .sr-rank-strip strong { font-size:1.35rem; }
    @media (max-width:980px) {
      .sr-remote-wrap { grid-template-columns:1fr; }
      .sr-side-ads { position:relative; top:auto; grid-template-columns:repeat(2,minmax(0,1fr)); }
      .sr-panel { grid-template-columns:1fr; }
      .sr-panel-media { min-height:20rem; }
      .sr-product-grid { grid-template-columns:1fr; }
      .sr-nav-six { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .sr-rank-strip { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:640px) {
      .sr-top-ad-strip { grid-auto-columns:minmax(16rem,85vw); overflow-x:auto; }
      .sr-remote-head { grid-template-columns:1fr; }
      .sr-nav-six { grid-template-columns:1fr; }
      .sr-feature-grid { grid-template-columns:1fr; }
      .sr-side-ads { grid-template-columns:1fr; }
      #ariaRoam, #jakeRoam { display:none; }
    }
  </style>
</head>
<body>
  <main class="sr-page">
    <section class="sr-top-ad-strip" id="topAdStrip" aria-label="SupportRD package ads"></section>
    <div class="sr-remote-wrap">
      <section class="sr-remote" aria-label="SupportRD Remote">
        <header class="sr-remote-head">
          <div class="sr-brand">
            <h1>SupportRD Remote</h1>
            <p>Professional hair, AI assistants, studio creation, live diary, catalog, Shopify readiness, and rank seriousness.</p>
          </div>
          <div class="sr-top-actions">
            <button class="sr-mini-btn" data-route="aria">ARIA</button>
            <button class="sr-mini-btn" data-route="jake">Jake</button>
            <button class="sr-mini-btn sr-settings-btn" data-route="settings">Settings</button>
            <button class="sr-mini-btn sr-catalog-hero-btn" data-route="catalog">Catalog / Buy</button>
          </div>
        </header>
        <nav class="sr-nav-six" aria-label="Main remote panels">
          <button class="sr-nav-btn active" data-route="diary"><span>Live lane</span>Diary</button>
          <button class="sr-nav-btn" data-route="studio"><span>Creation</span>Studio</button>
          <button class="sr-nav-btn" data-route="profile"><span>Professional</span>Profile</button>
          <button class="sr-nav-btn" data-route="faq"><span>SEO/social</span>FAQ Lounge</button>
          <button class="sr-nav-btn" data-route="map"><span>Perks</span>Map Change</button>
          <button class="sr-nav-btn" data-route="market"><span>Reader</span>Market Laser</button>
        </nav>
        <section class="sr-stage" id="remoteStage" aria-live="polite"></section>
        <section class="sr-rank-strip" id="rankStrip" aria-label="Rank and Shopify state"></section>
      </section>
      <aside class="sr-side-ads" id="rightAdStrip" aria-label="SupportRD right side ads"></aside>
    </div>
    <button class="sr-roam" id="ariaRoam" data-route="aria" type="button"><span class="sr-roam-orb">A</span><span><strong>ARIA</strong><small>Need help?</small></span></button>
    <button class="sr-roam" id="jakeRoam" data-route="jake" type="button"><span class="sr-roam-orb">J</span><span><strong>Jake</strong><small>Studio check?</small></span></button>
  </main>
  <script src="/static/rebuild/sr-app-state.js"></script>
  <script src="/static/rebuild/sr-fullscreen-remote.js"></script>
  <script src="/static/rebuild/sr-commerce-rank.js"></script>
  <script src="/static/app.v20260320h.js"></script>
</body>
</html>
