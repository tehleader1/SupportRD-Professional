<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SupportRD Remote</title>

<link rel="stylesheet" href="/static/style.css"/>

<style>
:root {
  --bg:#07111f;
  --panel:#0f1c2e;
  --accent:#0ea5b7;
  --text:#ffffff;
}

body {
  margin:0;
  font-family:system-ui, -apple-system;
  background:var(--bg);
  color:var(--text);
}

/* SHELL */
#remoteShell {
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* HEADER */
#remoteHeader {
  padding:16px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel);
}

/* NAV */
#remoteNav {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:10px;
  background:#0b1626;
}

.remoteBtn {
  padding:10px;
  border-radius:8px;
  border:none;
  background:var(--accent);
  color:white;
  cursor:pointer;
  font-weight:600;
}

/* CONTENT */
#remoteContent {
  flex:1;
  overflow:hidden;
}

.remoteFrame {
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div id="remoteShell">

  <div id="remoteHeader">
    <h2>SupportRD Remote</h2>

    <div>
      <button onclick="openRoute('aria')">Aria</button>
      <button onclick="openRoute('jake')">Jake</button>
    </div>
  </div>

  <div id="remoteNav">
    <button class="remoteBtn" onclick="openRoute('diary')">Diary</button>
    <button class="remoteBtn" onclick="openRoute('studio')">Studio</button>
    <button class="remoteBtn" onclick="openRoute('profile')">Profile</button>
    <button class="remoteBtn" onclick="openRoute('faq')">FAQ</button>
    <button class="remoteBtn" onclick="openRoute('settings')">Settings</button>
    <button class="remoteBtn" onclick="openRoute('catalog')">Catalog</button>
    <button class="remoteBtn" onclick="openRoute('map')">Map</button>
  </div>

  <div id="remoteContent"></div>

</div>

<script src="/static/rebuild/sr-fullscreen-remote.js"></script>
<script src="/static/app.v20260320h.js"></script>

</body>
</html>
